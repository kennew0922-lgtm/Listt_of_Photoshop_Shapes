<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photoshop Manual Series</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #eeeeee;
        }

        /* --- 🌸 ヘッダー全体を固定（ここが大事！） --- */
        .fixed-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 9999; /* 重なり順を一番上に */
            background-color: #1a1a1a;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        /* タイトルバナー（高さ65px） */
        .title-banner {
            background-color: #000000;
            height: 65px; 
            box-sizing: border-box;
            padding: 15px 20px;
            border-bottom: 1px solid #333;
        }

        .title-banner h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #00a8ff;
            border-left: 5px solid #008eb6;
            padding-left: 15px;
            line-height: 1.2;
        }

        /* ナビゲーションバー（高さ35px） */
        .nav-bar {
            background-color: #000000;
            height: 35px;
            box-sizing: border-box;
            display: flex;
            justify-content: flex-end;
            padding: 0 10px;
            align-items: center;
            border-bottom: 2px solid #008eb6;
        }

        .nav-bar a {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 0 15px;
            line-height: 35px;
            border-right: 1px solid #444;
            transition: color 0.3s;
        }

        /* --- コンテンツエリア --- */
        .container {
            max-width: 900px;
            margin: 0 auto;
            /* 🌸 ヘッダーの合計(100px)＋余白分を確保 */
            padding-top: 120px; 
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #2b2b2b;
            border-radius: 8px;
            overflow: hidden;
        }

        /* --- 🌸 運命の「Shape Name」バーの固定設定 --- */
        th {
            background-color: #008eb6;
            color: white;
            position: sticky;
            /* 🌸 ヘッダー合計 100px の位置に吸着！ */
            top: 20px; 
            z-index: 100;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid #3d3d3d;
        }

        .preview-img {
            max-width: 300px;
            height: auto;
            border-radius: 4px;
        }
    </style>
</head>
